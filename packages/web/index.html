<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vasta</title>
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vasta" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div class="remove-blur" aria-hidden="true"></div>
    <div id="app"></div>
    <script>
      (function () {
        function initBlurFix() {
          var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
            navigator.standalone === true;
          var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
            (navigator.userAgent.indexOf('Macintosh') !== -1 && navigator.maxTouchPoints > 1);
          if (!isStandalone || !isIOS) return;

          if (document.getElementById('ojapp-blur-panel')) return;

          var cover = document.createElement('div');
          cover.id = 'ojapp-blur-cover';
          var panel = document.createElement('div');
          panel.id = 'ojapp-blur-panel';
          (document.body || document.documentElement).appendChild(cover);
          (document.body || document.documentElement).appendChild(panel);

          void panel.offsetWidth;

          requestAnimationFrame(function () {
            cover.style.display = 'block';
            panel.style.transform = 'translateX(0%)';
            setTimeout(function () {
              cover.style.display = 'none';
              panel.style.transform = 'translateX(110%)';
              // Keep panel in DOM off-screen to preserve WebKit compositing state
            }, 500);
          });
        }

        if (document.readyState === 'loading') {
          window.addEventListener('DOMContentLoaded', initBlurFix, { once: true });
        } else {
          initBlurFix();
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
